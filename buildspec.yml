# AWS CodeBuild buildspec — PDF Compression Frontend.
#
# Pipeline:
#   GitHub (main) -> CodePipeline -> CodeBuild -> tests/validation
#   -> deployment artifact -> S3 deployment
#
# The deployment artifact contains ONLY website files.
# Test files, README, buildspec, and CI files are excluded.

version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python3 --version

  build:
    commands:
      - 'echo "Running frontend static checks..."'
      - python3 checks.py

      - 'echo "Running frontend test suites..."'
      - python3 test_merge.py
      - python3 test_split.py
      - python3 test_rotate.py
      - python3 test_delete.py
      - python3 test_filenames.py
      - python3 test_jpg_to_pdf.py
      - python3 test_pdf_to_jpg.py

      - 'echo "All frontend validation passed."'

      # Create a clean deployment directory containing only website files.
      - 'echo "Preparing S3 deployment artifact..."'
      - rm -rf deploy
      - mkdir -p deploy/assets/css
      - mkdir -p deploy/assets/js

      # HTML pages
      - cp index.html deploy/
      - cp compress.html deploy/
      - cp delete.html deploy/
      - cp edit.html deploy/
      - cp extract.html deploy/
      - cp jpg-to-pdf.html deploy/
      - cp merge.html deploy/
      - cp pdf-to-jpg.html deploy/
      - cp rotate.html deploy/
      - cp split.html deploy/
      - cp tool.html deploy/

      # CSS
      - cp assets/css/styles.css deploy/assets/css/

      # JavaScript
      - cp assets/js/*.js deploy/assets/js/

      - 'echo "S3 deployment artifact prepared."'
      - find deploy -type f | sort

  post_build:
    commands:
      - 'echo "Frontend CI build complete. Artifact is ready for S3 deployment."'

artifacts:
  base-directory: deploy
  files:
    - '**/*'
